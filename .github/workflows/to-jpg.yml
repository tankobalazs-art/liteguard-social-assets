name: to-jpg
on:
  push:
    paths: ['**/*.png']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert PNG to 1080x1350 JPEG
        run: |
          pip install -q pillow
          python - <<'EOF'
          import glob, os
          from PIL import Image, ImageOps
          for f in glob.glob('*/image.png'):
              im = Image.open(f).convert('RGB')
              im = ImageOps.fit(im, (1080, 1350), Image.LANCZOS)
              im.save(os.path.join(os.path.dirname(f), 'post.jpg'), 'JPEG', quality=90, optimize=True)
          EOF
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'Convert images to JPEG'
          git push
