name: to-jpg
on:
  push:
    paths: ['**/*.png', 'daily.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert images, split sheets, build schedule
        run: |
          pip install -q pillow
          python - <<'PY'
          import glob, os
          from PIL import Image, ImageOps
          def save(im, folder):
              os.makedirs(folder, exist_ok=True)
              ImageOps.fit(im.convert('RGB'), (1080, 1350), Image.LANCZOS).save(
                  os.path.join(folder, 'post.jpg'), 'JPEG', quality=90, optimize=True)
          for f in glob.glob('*/image.png'):
              save(Image.open(f), os.path.dirname(f))
          for f in glob.glob('sheets/*/image.png'):
              ids = os.path.basename(os.path.dirname(f)).split('_')
              im = Image.open(f); w = im.width // len(ids)
              for i, pid in enumerate(ids):
                  save(im.crop((i * w, 0, (i + 1) * w, im.height)), pid)
          PY
          if [ -f daily.py ]; then python daily.py; fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'Convert images / build schedule'
          git push
